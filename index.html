<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarmeen's Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <h1>Zarmeen's Portfolio</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
            <button id="theme-btn">🌙 Dark Mode</button>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <h2>Hello, I'm a Web Development Beginner! ✨</h2>
        <p>Learning HTML, CSS, and JavaScript step by step.</p>
    </section>

    <!-- Projects Section -->
    <section id="projects">
        <h2>My Projects</h2>
        <div class="project-card">
            <h3>Coffee Shop Website</h3>
            <p>A fully responsive local coffee shop landing page deployed on GitHub Pages.</p>
            <a href="https://zarmeendev5-ui.github.io/coffee-shop-website/" target="_blank">Live Demo</a>
        </div>
    </section>

    <!-- Contact Form Section -->
    <section id="contact">
        <h2>Contact Me</h2>
        <form id="contact-form">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea id="message" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
        <p id="success-msg"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
